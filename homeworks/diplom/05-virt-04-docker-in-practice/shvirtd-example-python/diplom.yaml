include:
  - proxy.yaml

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    ports:
      - "5000:5000"
    networks:
      backend:
        ipv4_address: 172.20.0.5
    environment:
      DB_HOST: ${MYSQL_HOST}
      DB_USER: app
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: diplom_db
    env_file:
      - .env
